<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>💖Happy Friendship Day💖</title>

<style>

.page-progress{

    margin-top:25px;

    text-align:center;

    color:white;

    font-size:14px;

    letter-spacing:2px;

}

.welcome-title{
    font-size:40px;
    animation:zoom 2s infinite alternate;
}

@keyframes zoom{
    from{
        transform:scale(1);
    }
    to{
        transform:scale(1.08);
    }
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff9ecf,#d4a5ff,#87cefa);
overflow:hidden;
}

.card{
width:90%;
max-width:450px;
padding:40px;
background:rgba(255,255,255,.15);
backdrop-filter:blur(15px);
border-radius:25px;
text-align:center;
color:white;
box-shadow:0 0 25px rgba(0,0,0,.2);
animation:fade 1.2s;
}

h1{
font-size:35px;
margin-bottom:15px;
}

#typing{
font-size:20px;
height:40px;
margin-bottom:30px;
}

button{
padding:15px 40px;
font-size:18px;
border:none;
border-radius:40px;
background:white;
color:#ff4f9a;
cursor:pointer;
transition:.3s;
font-weight:bold;
}

button:hover{
transform:scale(1.08);
}

@keyframes fade{
from{
opacity:0;
transform:translateY(40px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.heart{
position:absolute;
font-size:25px;
animation:float 8s linear infinite;
}

@keyframes float{

0%{
transform:translateY(100vh);
opacity:0;
}

100%{
transform:translateY(-120vh);
opacity:1;
}

}

</style>

</head>

<body>

<audio id="bgMusic" autoplay loop>
    <source src="music1.mp3" type="audio/mpeg">
</audio>

<div class="card">

<h1 class="welcome-title">💖 Welcome 💖</h1>

<div id="typing"></div>

<button onclick="startPage()">Start 🚀</button>
    
<div class="page-progress">

    Page 1 of 7

    <br><br>

    ❤️ 🤍 🤍 🤍 🤍 🤍 🤍

</div>
</div>

<script>

const text = "Initializing Friendship System...";
let i = 0;

function type() {
    if (i < text.length) {
        document.getElementById("typing").innerHTML += text.charAt(i);
        i++;
        setTimeout(type, 70);
    }
}

type();

for (let j = 0; j < 30; j++) {

    let h = document.createElement("div");

    h.className = "heart";

    h.innerHTML = Math.random() > 0.5 ? "❤️" : "🌸";

    h.style.left = Math.random() * 100 + "%";

    h.style.animationDuration = (5 + Math.random() * 6) + "s";

    h.style.fontSize = (20 + Math.random() * 25) + "px";

    document.body.appendChild(h);

}

const music = document.getElementById("bgMusic");

window.onload = function () {
    music.play().catch(() => {
        console.log("Autoplay blocked");
    });
};

function startPage() {
    location.href = "page2.html";
}

</script>

</body>
</html>

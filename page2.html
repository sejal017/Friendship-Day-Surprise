<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Connecting... 🚀</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Consolas, monospace;
}

body{
    background:#000;
    color:#00ff66;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.terminal{

    width:90%;
    max-width:750px;

    padding:30px;

    border:2px solid #00ff66;
    border-radius:15px;

    box-shadow:0 0 30px #00ff66;
	
	max-height:90vh;
overflow-y:auto;
}

.terminal-header{

    color:#00ff66;
    font-size:18px;

    border-bottom:1px solid #00ff66;

    padding-bottom:10px;
    margin-bottom:25px;

}

#text{

    white-space:pre-line;

    font-size:20px;
    line-height:35px;

}

.progress{

    width:100%;
    height:18px;

    background:#222;

    border-radius:20px;

    overflow:hidden;

    display:none;

    margin:18px 0;

}

.bar{

    height:100%;
    width:0%;

    background:#00ff66;

}

button{

    display:none;

    margin-top:25px;

    padding:14px 35px;

    border:none;

    border-radius:35px;

    background:#ff4fa2;

    color:white;

    cursor:pointer;

    font-size:18px;

    transition:.3s;

}

.page-progress{

    margin-top:25px;

    text-align:center;

    color:#bfbfbf;

    font-size:14px;

    letter-spacing:2px;

}

button:hover{

    transform:scale(1.05);
    box-shadow:0 0 20px #ff4fa2;

}

.cursor{

    animation:blink .8s infinite;

}

@keyframes blink{

50%{
opacity:0;
}

}

</style>

</head>

<body>

<audio id="bgMusic" autoplay loop>
    <source src="music1.mp3" type="audio/mpeg">
</audio>

<div class="terminal">

<div class="terminal-header">
Friendship Terminal v1.0
</div>

<div id="text"></div>

<div class="progress">

<div class="bar"></div>

</div>

<br>

<button onclick="location.href='page3.html'">

Continue ➜

</button>

<div class="page-progress">
    <br><br>
    Page 2 of 7
    <br>
    ❤️ ❤️ 🤍 🤍 🤍 🤍 🤍
</div>

</div>

<script>

const text=document.getElementById("text");

const progress=document.querySelector(".progress");

const bar=document.querySelector(".bar");

const button=document.querySelector("button");

const lines=[

"C:\\Friendship> boot friendship.exe",

"",

"Initializing Friendship System..."

];

let i=0;

function typing(){

if(i<lines.length){

text.innerHTML += lines[i] + "<br>";

i++;

setTimeout(typing,700);

}
else{

loading();

}

}

typing();

function loading(){

progress.style.display="block";

let width=0;

let load=setInterval(function(){

width++;

bar.style.width=width+"%";

if(width>=100){

clearInterval(load);

progress.style.display="none";

text.innerHTML += "<br>✔ Connection Successful<br><br>";
text.innerHTML += "Searching Best Friend...<br>";

loading2();

}

},30);

}

function loading2(){

progress.style.display="block";

bar.style.width="0%";

let width=0;

let load=setInterval(function(){

width++;

bar.style.width=width+"%";

if(width>=100){

clearInterval(load);

progress.style.display="none";

text.innerHTML += "<br>❤️ Friend Detected ❤️<br>";
text.innerHTML += "Access Granted...<br>";

button.style.display="inline-block";

}

},25);

}

</script>

</body>
</html>

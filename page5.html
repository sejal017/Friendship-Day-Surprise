<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 Friend Search ⚠️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Consolas,monospace;
}

body{
background:#0b0b0b;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
color:#00ff66;
}

.box{

width:90%;
max-width:700px;

padding:35px;

border:2px solid #00ff66;
border-radius:15px;

box-shadow:0 0 25px #00ff66;

text-align:center;

}

h1{

font-size:40px;

margin-bottom:20px;

color:#ff4fa2;

text-shadow:0 0 15px #ff4fa2;

}

#text{

font-size:20px;

line-height:38px;

white-space:pre-line;

margin-top:20px;

}

.progress{

width:100%;

height:18px;

background:#222;

border-radius:20px;

overflow:hidden;

margin:20px 0;

display:none;

}

.bar{

height:100%;
width:0%;
background:#00ff66;

}

button{

padding:14px 35px;

font-size:18px;

border:none;

border-radius:30px;

cursor:pointer;

margin:10px;

transition:.3s;

display:none;

}

#retry{

background:#00ff66;

color:black;

}

#next{

background:#ff4fa2;

color:white;

}

button:hover{

transform:scale(1.05);

}

.page-progress{

margin-top:25px;

font-size:14px;

color:#bfbfbf;

}

</style>

</head>

<body>

  <audio id="bgMusic" autoplay loop>
    <source src="music1.mp3" type="audio/mpeg">
</audio>

<div class="box">

<h1>404 ERROR</h1>

<div id="text">
Searching Better Friend...
</div>

<div class="progress">
<div class="bar"></div>
</div>

<button id="retry" onclick="retrySearch()">
Try Again 🔄
</button>

<button id="next" onclick="location.href='page6.html'">
Continue ➜
</button>

<div class="page-progress">

Page 5 of 7

<br><br>

❤️ ❤️ ❤️ ❤️ ❤️ 🤍 🤍

</div>

</div>

<script>

const text=document.getElementById("text");
const progress=document.querySelector(".progress");
const bar=document.querySelector(".bar");
const retry=document.getElementById("retry");
const next=document.getElementById("next");

function search(){

progress.style.display="block";

bar.style.width="0%";

let width=0;

let load=setInterval(function(){

width++;

bar.style.width=width+"%";

if(width>=100){

clearInterval(load);

progress.style.display="none";

text.innerHTML=`
Searching Better Friend...

❌ Better Friend Not Found.

━━━━━━━━━━━━━━━━━━━━

Reason :

Current Friend is

❤️ IRREPLACEABLE ❤️

━━━━━━━━━━━━━━━━━━━━
`;

retry.style.display="inline-block";

}

},25);

}

search();

function retrySearch(){

retry.style.display="none";

text.innerHTML="Searching Again...";

search();

setTimeout(function(){

next.style.display="inline-block";

},3000);

}

</script>

</body>
</html>

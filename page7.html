<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>💖 Final Message 💖</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Consolas,monospace;
}

body{
background:linear-gradient(135deg,#ff9acb,#b58cff,#8ec5ff);

display:flex;
justify-content:center;
align-items:center;

overflow-y:auto;

min-height:100vh;

padding:30px 0;

color:#333;
}

.final{

width:90%;
max-width:700px;

padding:30px;

background:rgba(255,255,255,.18);
backdrop-filter:blur(12px);

border:2px solid rgba(255,255,255,.45);

border-radius:20px;

box-shadow:0 0 30px rgba(255,255,255,.35);

max-height:90vh;
overflow-y:auto;

}

h2{
text-align:center;
margin-bottom:25px;
color:#ffffff;
text-shadow:0 0 10px rgba(0,0,0,.25);
}

#result{
white-space:pre-line;
font-size:20px;
line-height:35px;
color:#ffffff;
}

button{

display:none;

margin-top:30px;

padding:14px 35px;

background:#ff4fa2;

color:white;

border:none;

border-radius:30px;

font-size:18px;

cursor:pointer;

transition:.3s;

}

button:hover{

transform:scale(1.05);

box-shadow:0 0 20px #ff4fa2;

}

.page-progress{
margin-top:30px;
text-align:center;
color:#ffffff;
font-size:14px;
}

.final-text{
color:#fff;
font-size:26px;
font-weight:bold;
text-align:center;
text-shadow:0 0 15px #ff4fa2;
}

@keyframes glow{

from{
text-shadow:0 0 10px #ff69b4;
}

to{
text-shadow:0 0 25px #ff69b4;
}

}

@media(max-width:600px){

#result{
font-size:18px;
line-height:30px;
}

h2{
font-size:26px;
}

button{
width:100%;
}

}

.heart{
    position:fixed;
    top:110vh;
    pointer-events:none;
    z-index:999;
    animation:float 8s linear forwards;
}

@keyframes float{

0%{
    transform:translateY(0) rotate(0deg);
    opacity:0;
}

15%{
    opacity:1;
}

100%{
    transform:translateY(-130vh) rotate(360deg);
    opacity:0;
}

}

</style>

</head>

<body>

<div class="final">

<h2>💖 FINAL MESSAGE 💖</h2>

<div id="result"></div>

<button onclick="location.href='index.html'">

💌 Visit Again

</button>

<div class="page-progress">

Page 7 of 7

<br><br>

❤️ ❤️ ❤️ ❤️ ❤️ ❤️ ❤️

</div>

</div>

<script>

const result=document.getElementById("result");

const button=document.querySelector("button");

const lines=[

"Initializing Final Message...",

"",

"Loading Beautiful Memories...",

"",

"✔ Friendship Status : Forever ❤️",

"✔ Trust Level : Infinite ♾️",

"✔ Smile Generator : Activated 😊",

"",

'<div class="final-text">🎉 HAPPY FRIENDSHIP DAY 🎉</div>',

"",

"💖 Thank You For Being",

"The Best Friend In My Life.",

"",

"No matter how much we fight,",

"I'll always be lucky to have you.",

"",

"Our Friendship = Forever ♾️❤️",

"",

"✨ Friendship isn't about",

"who you've known the longest...",

"It's about who never left",

"your side. ❤️",

"",

"Made with ❤️ & Lots of Memories",

"~ Sejal 🌸"

];

let i=0;

function typing(){

if(i<lines.length){

result.innerHTML+=lines[i]+"<br>";

i++;

setTimeout(typing,700);

}
else{

button.style.display="inline-block";

}

}

typing();

const emojis=["💖","🌸","✨","💗"];

function createEmoji(){

const item=document.createElement("div");

item.className="heart";

item.innerHTML=emojis[Math.floor(Math.random()*emojis.length)];

item.style.left=Math.random()*100+"vw";

item.style.fontSize=(20+Math.random()*20)+"px";

item.style.animationDuration=(5+Math.random()*4)+"s";

document.body.appendChild(item);

setTimeout(function(){
item.remove();
},9000);

}

setInterval(createEmoji,350);

window.onload = function () {

    window.scrollTo(0, 0);

    document.body.style.overflowY = "auto";

};

<button onclick="startMusic()">🎵 Play Song</button>

<script>
function startMusic(){
    document.getElementById("bgMusic").play();
}
</script>

</script>

</body>

</html>

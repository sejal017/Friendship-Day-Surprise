<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🔓 Achievement Unlocked 🔓</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Consolas,monospace;
}

body{
background:#111;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
color:#00ff66;
}

.card{

width:90%;
max-width:700px;

padding:35px;

border:2px solid #00ff66;
border-radius:15px;

box-shadow:0 0 25px #00ff66;

text-align:center;

animation:fade 1s;

}

.trophy{

font-size:80px;

animation:bounce 2s infinite;

}

h1{

margin:20px 0;

color:#FFD700;

text-shadow:0 0 20px gold;

}

.reward{

margin-top:30px;

font-size:22px;

line-height:45px;

}

.reward p{

opacity:0;

animation:show .8s forwards;

}

.reward p:nth-child(1){animation-delay:.5s;}
.reward p:nth-child(2){animation-delay:1s;}
.reward p:nth-child(3){animation-delay:1.5s;}
.reward p:nth-child(4){animation-delay:2s;}

button{

display:none;

margin:35px auto 0;

padding:14px 35px;

font-size:18px;

background:#ff4fa2;

color:white;

border:none;

border-radius:30px;

cursor:pointer;

transition:.3s;

}

button:hover{

transform:scale(1.05);

box-shadow:0 0 20px #ff4fa2;

}

.page-progress{

margin-top:30px;

font-size:14px;

color:#bfbfbf;

}

@keyframes bounce{

0%,100%{
transform:translateY(0);
}

50%{
transform:translateY(-12px);
}

}

@keyframes fade{

from{

opacity:0;
transform:scale(.9);

}

to{

opacity:1;
transform:scale(1);

}

}

@keyframes show{

from{

opacity:0;
transform:translateX(-40px);

}

to{

opacity:1;
transform:translateX(0);

}

}

</style>

</head>

<body>

  <audio id="bgMusic" autoplay loop>
    <source src="music1.mp3" type="audio/mpeg">
</audio>

<div class="card">

<div class="trophy">
🏆
</div>

<h1>ACHIEVEMENT UNLOCKED</h1>

<div class="reward">

<p>❤️ Best Friend Forever</p>

<p>😊 Happiness +999</p>

<p>🤝 Trust Level : ∞</p>

<p>🎁 Reward : Lifetime Friendship</p>

</div>

<button id="next" onclick="location.href='page7.html'">

Final Surprise 🎁

</button>

<div class="page-progress">

Page 6 of 7

<br><br>

❤️ ❤️ ❤️ ❤️ ❤️ ❤️ 🤍

</div>

</div>

<script>

setTimeout(function(){

document.getElementById("next").style.display="block";

},3000);

</script>

</body>

</html>
